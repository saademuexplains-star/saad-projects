<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}body{margin:0}</style></head><body>
<canvas id="c"></canvas>
<script src="data.js"></script><script src="lib.js"></script>
<script>
// Brand: deep ocean teal + coral accent + sand
const TEAL1='#145a5f', TEAL2='#0a2c33', CORAL='#ff5a4e', SAND='#f3e6cc';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
window.ready=loadAll().then(()=>true);
function grain(c,w,h,a=.05){const id=c.getImageData(0,0,w,h),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*255*a;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}c.putImageData(id,0,0);}
function bg(c,w,h,cx,cy){const g=c.createRadialGradient(cx,cy,0,cx,cy,Math.hypot(w,h)*.6);g.addColorStop(0,TEAL1);g.addColorStop(1,TEAL2);c.fillStyle=g;c.fillRect(0,0,w,h);}
function wordmark(c,x,y,size){
  c.save(); c.textBaseline='alphabetic'; c.font=`900 ${size}px Montserrat`;
  if('letterSpacing' in c) c.letterSpacing=`${size*.02}px`;
  const a='NATURE SAID ', b='NO';
  const wa=c.measureText(a).width, wb=c.measureText(b).width, x0=x-(wa+wb+size*.22)/2;
  c.fillStyle='#fff'; c.textAlign='left'; c.fillText(a,x0,y);
  c.fillStyle=CORAL; c.fillText(b,x0+wa,y);
  // period-dot accent
  c.beginPath(); c.arc(x0+wa+wb+size*.14,y-size*.08,size*.08,0,TAU); c.fillStyle=CORAL; c.fill();
  c.restore(); return [x0,x0+wa+wb];
}
window.renderFrame=async(T)=>{
  if(T===0){ // profile picture 1200x1200 — mascot icon, no text
    cv.width=1200;cv.height=1200; bg(ctx,1200,1200,600,520);
    // soft sand disc behind mascot
    ctx.beginPath(); ctx.arc(600,640,430,0,TAU); ctx.fillStyle='rgba(243,230,204,.10)'; ctx.fill();
    dave(ctx,{x:600,y:905,s:.88,eye:{top:.42,lx:.18,ly:.05,pupil:.24},mouth:{type:'flat',w:95},shadowA:.45});
    grain(ctx,1200,1200,.035);
  } else if(T===1){ // banner 2560x1440; safe area 1546x423 centred (y 508..931)
    cv.width=2560;cv.height=1440; bg(ctx,2560,1440,1280,720);
    // subtle wave lines
    ctx.save(); ctx.strokeStyle='rgba(243,230,204,.06)'; ctx.lineWidth=3;
    for(let k=0;k<14;k++){ctx.beginPath(); for(let x=0;x<=2560;x+=20){const y=360+k*55+Math.sin(x/220+k)*14; x?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke();} ctx.restore();
    const [x0,x1]=wordmark(ctx,1280,742,120);
    ctx.save(); ctx.font='700 34px Montserrat'; if('letterSpacing' in ctx) ctx.letterSpacing='12px'; ctx.textAlign='center'; ctx.fillStyle=SAND; ctx.globalAlpha=.85;
    ctx.fillText('WEIRD TRUE ANIMAL STORIES',1280,822); ctx.restore();
    // thin coral rule
    ctx.fillStyle=CORAL; ctx.fillRect(1280-55,612,110,7);
    grain(ctx,2560,1440,.03);
  }
  return cv.toDataURL('image/png');
};
</script></body></html>
