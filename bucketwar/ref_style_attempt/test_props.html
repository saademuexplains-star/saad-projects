<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;font-weight:800;src:url(../fonts/Poppins-ExtraBold.ttf)}
@font-face{font-family:Anton;src:url(../fonts/Anton-Regular.ttf)}
body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script><script src="chars.js"></script><script src="props.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
window.testProps=()=>{
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=lgrad(ctx,0,0,0,1920,['#7fbbe8','#d8ecf5','#cdb783','#a88a52']);ctx.fillRect(0,0,1080,1920);
  drawCloud(ctx,250,200,1.2);drawCloud(ctx,800,330,1);
  ctx.save();ctx.translate(250,1000);drawWell(ctx,{s:.9,t:0.2});ctx.restore();
  ctx.save();ctx.translate(800,1000);drawTower(ctx,{s:.62});ctx.restore();
  ctx.save();ctx.translate(540,1500);drawBucket(ctx,{s:1.5,glow:.5});ctx.restore();
  ctx.save();ctx.translate(120,1850);drawMini(ctx,{s:.45,t:0.3,run:1});ctx.restore();
  ctx.save();ctx.translate(330,1850);drawMini(ctx,{s:.45,c1:'#e0ac33',c2:'#2f8f5b',hat:'cap',side:-1,t:0.3,run:1,ph:2});ctx.restore();
  ctx.save();ctx.translate(560,1880);drawMini(ctx,{s:.45,dead:1,spear:false});ctx.restore();
  ctx.save();ctx.translate(900,1850);drawBanner(ctx,{t:0.4,poleH:500,w:200,h:260});ctx.restore();
  ctx.save();ctx.translate(1010,1850);drawBanner(ctx,{t:0.4,poleH:500,w:-200,h:260,c1:'#2f8f5b',c2:'#f2eddf',cross:false,dir:1});ctx.restore();
  dustPuff(ctx,540,1200,120);starburst(ctx,540,700,160,220,12,0.2,'#ffcf2e');sparkle4(ctx,600,1330,1.3,.2);
  vignette(ctx);grain(ctx);
};
</script></body></html>
