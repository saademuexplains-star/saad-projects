<body><div id="root"></div>
<script>
const root = document.getElementById('root');
window.renderFrame = async n => {
  const out = [], step = n === 0 ? 1 : 1, N = ENG.FRAMES;
  let bad = 0;
  for (let k = 0; k < N; k += step) {
    try { const s = ENG.svgFrame(k); if (/NaN|undefined|Infinity/.test(s)) { const m = s.match(/.{60}(NaN|undefined|Infinity).{30}/); if (bad < 12) out.push('frame ' + k + ': ' + (m ? m[0] : '?').replace(/[<>&"]/g, ' ')); bad++; } }
    catch (e) { if (bad < 12) out.push('frame ' + k + ' EXC: ' + String(e && e.message || e).replace(/[<>&"]/g, ' ')); bad++; }
  }
  const head = ['trans: ' + ENG.trans.length + '  shots: ' + ENG.shots.map(s => s.id).join(','), 'bad frames: ' + bad, 'errors: ' + ((window.__E || []).join(' | ') || 'none')];
  const lines = head.concat(out).map((l, i) => `<text x="20" y="${60 + i * 44}" fill="#fff" font-size="26" font-family="Consolas">${l.slice(0, 74)}</text>`).join('');
  root.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#101010"/>${lines}</svg>`;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  return true;
};
window.READY = true;
