<body><div id="out">probe page: run probeLids() / checkAll()</div>
<script>
// Frames whose drawing a lid change can touch: any eye drawn with lid above thr (blinks included), as merged ranges.
window.probeLids = (thr = 0.46) => {
  const P = RIG.lidProbe, hit = [];
  for (let k = 0; k < ENG.FRAMES; k++) { P.reset(); ENG.svgFrame(k); if (P.get() > thr) hit.push(k); }
  const r = []; for (const k of hit) { if (r.length && k <= r[r.length - 1][1] + 1) r[r.length - 1][1] = k; else r.push([k, k]); }
  return { frames: hit.length, ranges: r.map(x => x[0] === x[1] ? '' + x[0] : x[0] + '-' + x[1]).join(',') };
};
// every frame: exceptions, NaN / undefined in the SVG; transitions and shots loaded
window.checkAll = () => {
  const bad = [];
  for (let k = 0; k < ENG.FRAMES; k++) { try { const s = ENG.svgFrame(k); if (/NaN|undefined|Infinity/.test(s)) bad.push(k); } catch (e) { bad.push(k + ':' + e.message); } }
  return { trans: ENG.trans.length, shots: ENG.shots.map(s => s.id + '[' + s.t0 + ',' + s.t1 + ']').join(' '), bad: bad.slice(0, 20), nBad: bad.length, errors: window.__E || [] };
};
window.READY = true;
</script></body></html>
