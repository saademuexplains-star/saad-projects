<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block}</style>
<script src="../lib/rig3.js"></script><script src="../lib/cine.js"></script><script src="../lib/env.js"></script>
<script src="cast.js"></script><script src="cast2.js"></script><script src="props.js"></script><script src="props2.js"></script><script src="sets1.js"></script><script src="sets2.js"></script><script src="sets3.js"></script><script src="sets4.js"></script>
<script>window.VIDEO_FRAMES = 3002;</script><script src="engine.js"></script></head>
<body><div id="root"></div>
<script>
const X = ENG, S = SETS;
const views = [
  () => X.compose(S.gate(1.0), [540, 1250, 0.95, 0]),
  () => X.compose(S.chapel(1.0), [540, 1150, 0.95, 0]),
  () => X.compose(S.garden(1.0).concat([{ p: 1, svg: S.urn(300, 1700, 1, 0) }]), [600, 1300, 0.95, 0]),
  () => X.compose(S.attic(1.0, { season: 1.5, night: 0.2 }), [400, 1200, 0.95, 0]),
  () => X.compose(S.palace(1.0), [600, 1150, 1.0, 0]),
  () => X.compose(S.dressing(1.0), [540, 1150, 1.0, 0]),
  () => { const c = S.classroom(1.0, { broken: 0 }); return X.compose([...c.back, ...c.front], [400, 1250, 0.62, 0]); },
  () => { const c = S.classroom(1.0, { broken: 0.6, door: 1 }); return X.compose([...c.back, ...c.front], [1100, 1300, 0.85, 0]); },
  () => X.compose(S.classShadow(1.0, ''), [540, 1100, 1.0, 0]),
  () => X.compose(S.marble(1.0, { hour: 0.4, drops: [[520, 900, 0.5]] }), [540, 900, 1.0, 0]),
  () => X.compose(S.street(1.0), [400, 1250, 1.0, 0]),
];
window.renderFrame = async n => {
  root.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs>${X.defs()}</defs><rect width="1080" height="1920" fill="#000"/>${views[n]()}${X.post(1, n)}</svg>`;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); return true;
};
const root = document.getElementById('root');
window.READY = true;
</script></body></html>
