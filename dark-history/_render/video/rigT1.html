    { who: 'semm', kind: 'man', x: 270, y: 905, name: 'YOU · IGNAZ SEMMELWEIS', face: { expr: 'anxious', look: [0.2, 0], lid: 0.2 } },
    { who: 'klein', kind: 'man', x: 810, y: 905, name: 'PROFESSOR KLEIN', face: { expr: 'stern', look: [-0.2, 0.05], lid: 0.34, age: true } },

    let g = S.lg('rsBg', [[0, '#3a2e24'], [0.5, '#2c2219'], [1, '#1e1610']]) + `<rect x="-100" y="-100" width="1280" height="2120" fill="url(#rsBg)"/>`;
    g += `<path d="M-100,958 L1180,958" stroke="#000" stroke-width="2" opacity="0.4"/><path d="M540,958 L540,2020" stroke="#000" stroke-width="2" opacity="0.4"/>`;
    for (const c of CELLS) {
      g += C.radial(c.x - 40, c.y - 520, 520, '#ffe0b0', 0.16) + `<ellipse cx="${c.x}" cy="${c.y}" rx="230" ry="34" fill="#140e0a" opacity="0.35" filter="url(#b8)"/>`;
      const o = ST.still(c.x, c.y, 0.56);

    const P = ST.up(Q.mother(Object.assign(o, { noLegs: true, face: { expr: 'fear', look: [-0.3, 0.05], lid: 0.12, sweat: 0.18, blush: 0.4, bags: 0.4 },
